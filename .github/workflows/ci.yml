name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm run verify:offline
      # assert the doc invariant: if sync-docs would change anything, a doc
      # was hand-edited (or left stale) and the push must fail
      - run: node scripts/sync-docs.mjs && git diff --exit-code
