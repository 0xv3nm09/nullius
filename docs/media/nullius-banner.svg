<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="nullius — take nobody's word for it. An executable NEAR investment thesis: 15 falsifiable propositions, 5 supported, 6 unsupported, 4 data-unusable; an audit gate over 20 fields that found 4 failures; SHA-256 hash chain, HS256 receipts, npm run verify.">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="rgba(255,255,255,0.05)"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fe4e1e"/><stop offset="1" stop-color="#f0641f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" fill="#0b0e11"/>
  <rect width="1200" height="260" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <g transform="translate(64,96)">
    <circle cx="30" cy="30" r="26" fill="none" stroke="#fe4e1e" stroke-width="6"/>
    <line x1="12" y1="48" x2="48" y2="12" stroke="#fe4e1e" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="150" y="118" font-family="'Bricolage Grotesque','DM Sans',system-ui,sans-serif" font-size="58" font-weight="800" fill="#f2eee5" letter-spacing="-1">nullius</text>
  <text x="150" y="156" font-family="'DM Mono',monospace" font-size="19" fill="#8a929c">take nobody's word for it — an executable NEAR investment thesis</text>
  <text x="64" y="206" font-family="'DM Mono',monospace" font-size="16" fill="#ff8a66">15 falsifiable propositions · audit gate over 20 fields · 4 findings</text>
  <g font-family="'DM Mono',monospace" font-size="15" fill="#8a929c">
    <rect x="712" y="70" width="118" height="34" rx="17" fill="none" stroke="#1b9e5f"/><text x="728" y="92" fill="#4cc98a">5 ✓ supported</text>
    <rect x="842" y="70" width="128" height="34" rx="17" fill="none" stroke="#d93a4a"/><text x="858" y="92" fill="#f4818e">6 ✕ unsupported</text>
    <rect x="982" y="70" width="150" height="34" rx="17" fill="none" stroke="#7b5bd6"/><text x="998" y="92" fill="#a98ff0">4 ⊘ data-unusable</text>
  </g>
  <text x="712" y="140" font-family="'DM Mono',monospace" font-size="15" fill="#8a929c">SHA-256 hash chain · HS256 receipts · tamper breaks the chain</text>
  <text x="712" y="166" font-family="'DM Mono',monospace" font-size="15" fill="#8a929c">2,307 days of NEAR mainnet · api.nearblocks.io</text>
  <text x="712" y="206" font-family="'DM Mono',monospace" font-size="16" fill="#f2eee5" font-weight="500">npm run verify — the thesis checks itself</text>
  <rect x="0" y="256" width="1200" height="4" fill="#14181c"/>
</svg>
